spring:
  application:
    name: service-seckill
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
      config:
        server-addr: localhost:8848
        #命名空间做环境隔离
        namespace: 286634bf-14d1-486f-b53a-a8aaa2af5221
        #配置文件后缀，properties文件不需要
        file-extension: yaml
        extension-configs:
          - group: seckill
            data-id: mysql.yaml
          - group: common
            data-id: redis.yaml
          - group: common
            data-id: tenant.yaml
            refresh: true
          - group: common
            data-id: filterPath.yaml
            refresh: true
          - group: common
            data-id: rocketmq.yaml
          - group: common
            data-id: common.yaml

server:
  port: 9013
  servlet:
    context-path: /seckill


# application.yml
seckill:
  url-mappings:
    - path: /seckill/kill/iphone15
      seckillItemId: 1507911104775458816
    - path: /seckill/kill/macbook
      seckillItemId: 1507911104775458816
seckill-coupon:
  url-mappings:
    - path: /seckill/kill/coupon
      seckillItemId: 1507911104775458816
