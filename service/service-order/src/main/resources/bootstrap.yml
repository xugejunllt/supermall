spring:
  application:
    name: service-order
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
        meta-data:
          appVersion: 9.7.3
      config:
        server-addr: localhost:8848
        namespace: 286634bf-14d1-486f-b53a-a8aaa2af5221
        file-extension: yaml
        extension-configs:
          - group: order
            data-id: mysql.yaml
          - group: common
            data-id: redis.yaml
          - group: common
            data-id: tenant.yaml
            refresh: true
          - group: common
            data-id: filterPath.yaml
            refresh: true
          - group: common
            data-id: rocketmq.yaml

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 9007
  servlet:
    context-path: /order

org:
  dromara:
    hmily :
      serializer: kryo
      recoverDelayTime: 30
      retryMax: 5
      scheduledDelay: 30
      scheduledThreadMax:  10
      repositorySupport: db
      started: true
      hmilyDbConfig:
        driverClassName: com.mysql.jdbc.Driver
        url: jdbc:mysql://localhost:3306/hmily?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        password: 123456

