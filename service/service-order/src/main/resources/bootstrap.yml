spring:
  application:
    name: service-order
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
        meta-data:
          appVersion: 9.7.3
      config:
        server-addr: localhost:8848
        namespace: 286634bf-14d1-486f-b53a-a8aaa2af5221
        file-extension: yaml
        extension-configs:
          - group: order
            data-id: mysql.yaml
          - group: common
            data-id: redis.yaml
          - group: common
            data-id: tenant.yaml
            refresh: true
          - group: common
            data-id: filterPath.yaml
            refresh: true
          - group: common
            data-id: rocketmq.yaml

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 9007
  servlet:
    context-path: /order

org:
  dromara:
    hmily :
      serializer: kryo
      recoverDelayTime: 30
      retryMax: 5
      scheduledDelay: 30
      scheduledThreadMax:  10
      repositorySupport: db
      started: true
      hmilyDbConfig:
        driverClassName: com.mysql.jdbc.Driver
        url: jdbc:mysql://localhost:3306/hmily?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        password: 123456

sharding:
  sphere:
    sql-show: true
    datasource:
      ds0:
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/order_db_0?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        password: 123456
        maximum-pool-size: 10
      ds1:
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/order_db_1?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        password: 123456
        maximum-pool-size: 10
    sharding:
      tables:
        t_order:
          actual-data-nodes: ds${0..1}.t_order_${0..7}
          database-sharding-column: user_id
          table-sharding-column: user_id
          database-algorithm-name: database-sharding-algorithm
          table-algorithm-name: table-sharding-algorithm
      algorithms:
        database-sharding-algorithm:
          type: CLASS_BASED
          algorithm-class-name: com.lanf.order.config.DatabaseShardingAlgorithm
        table-sharding-algorithm:
          type: CLASS_BASED
          algorithm-class-name: com.lanf.order.config.TableShardingAlgorithm
