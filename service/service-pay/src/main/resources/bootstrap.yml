spring:
  application:
    name: service-pay
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
        meta-data:
          #大版本 小版本 bug修改版本/小功能
          appVersion: 9.7.3
      config:
        server-addr: localhost:8848
        #命名空间做环境隔离
        namespace: 286634bf-14d1-486f-b53a-a8aaa2af5221
        #配置文件后缀，properties文件不需要
        file-extension: yaml
        extension-configs:
          - group: pay
            data-id: mysql.yaml
          - group: common
            data-id: redis.yaml
          - group: common
            data-id: tenant.yaml
          - group: common
            data-id: filterPath.yaml
          - group: common
            data-id: rocketmq.yaml
          - group: common
            data-id: common.yaml

server:
  port: 9009
  servlet:
    context-path: /pay
mybatis-plus:
  mapper-locations: classpath:com/lanf/pay/mapper/xml/*.xml
