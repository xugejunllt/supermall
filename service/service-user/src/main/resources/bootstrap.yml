spring:
  application:
    name: service-user
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
        meta-data:
          #大版本 小版本 bug修改版本/小功能
          appVersion: 9.7.3
      config:
        server-addr: localhost:8848
        #命名空间做环境隔离
        namespace: 286634bf-14d1-486f-b53a-a8aaa2af5221
        #配置文件后缀，properties文件不需要
        file-extension: yaml
        extension-configs:
          - group: user
            data-id: mysql.yaml
          - group: common
            data-id: redis.yaml
          - group: common
            data-id: tenant.yaml
          - group: common
            data-id: rocketmq.yaml
          - group: common
            data-id: filterPath.yaml
            refresh: true
          - group: common
            data-id: rocketmq.yaml
server:
  port: 9006
  servlet:
    context-path: /user
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #开启sql日志

sign:
  enabled: true
  paths:
    #用于测试 不需要登入 签名生成在UserTest.testCompleteSignProcess2
    - /user/app/user/signTest1
    #用于测试 不需要登入 签名生成在UserTest.testCompleteSignProcess2
    - /user/app/user/signTest2
# 鉴权路径配置
auth:
  # 排除鉴权的路径列表（支持完全匹配）
  exclude-auth-paths:
    - /user/app/user/register
    - /user/app/user/registerSendCode
    - /user/app/user/getSignKey
    - /user/app/user/loginSendCode
    - /user/app/user/login
    - /user/app/user/refreshToken
    - /user/app/user/signTest1
  internalServicePaths:
    #内部接口
    - /user/app/user/registerSendCode2