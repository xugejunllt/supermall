spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  application:
    name: service-goods

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
        meta-data:
          appVersion: 9.7.3
      config:
        server-addr: localhost:8848
        namespace: 286634bf-14d1-486f-b53a-a8aaa2af5221
        file-extension: yaml
        extension-configs:
          - group: common
            data-id: redis.yaml
          - group: common
            data-id: tenant.yaml
          - group: common
            data-id: filterPath.yaml
            refresh: true
          - group: common
            data-id: rocketmq.yaml
          - group: common
            data-id: hmily.yaml
          - group: common
            data-id: common.yaml

server:
  port: 9005
  servlet:
    context-path: /goods

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

