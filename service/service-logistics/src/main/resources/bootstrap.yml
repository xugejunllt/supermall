spring:
  application:
    name: service-logistics
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
      config:
        server-addr: localhost:8848
        #命名空间做环境隔离
        namespace: 286634bf-14d1-486f-b53a-a8aaa2af5221
        #配置文件后缀，properties文件不需要
        file-extension: yaml
        extension-configs:
          - group: logistics
            data-id: mysql.yaml
          - group: common
            data-id: redis.yaml
          - group: common
            data-id: tenant.yaml
          - group: common
            data-id: rocketmq.yaml
          - group: common
            data-id: filterPath.yaml
            refresh: true
          - group: common
            data-id: rocketmq.yaml
          - group: common
            data-id: seata.yaml
          - group: common
            data-id: interfacemonitor.yaml
          - group: common
            data-id: common.yaml
server:
  port: 9010
  servlet:
    context-path: /logistics
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #开启sql日志

express100:
  callback: 350fc4ac.nat123.fun/logistics/out/expressPush
